name: Temporary parity distribution regeneration
on:
  push:
    branches:
      - fix/native-sfd-parity-convergence-20261020
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Commit generated lib artifacts to the parity branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib
          if ! git diff --cached --quiet; then
            git commit -m "build: synchronize compiled native workflow distributables"
            git push origin HEAD:refs/heads/fix/native-sfd-parity-convergence-20261020
          fi
