name: Temporary model route bundle synchronization
on:
  push:
    branches: [feat/model-family-external-routing-20261020]
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Commit generated lib bundles to routing branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib
          if ! git diff --cached --quiet; then
            git commit -m "build: synchronize external routing compiled bundles"
            git push origin HEAD:refs/heads/feat/model-family-external-routing-20261020
          fi
