name: Verify plugin

on:
  push:
    branches: [main, work/sfd-native-parity-20261019]
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Synchronize built distributable on migration branch
        if: github.ref_name == 'work/sfd-native-parity-20261019'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib
          if ! git diff --cached --quiet; then
            git commit -m 'build: synchronize bundled plugin distribution'
            git push origin HEAD:work/sfd-native-parity-20261019
          fi
      - name: Verify committed distributable matches source
        run: git diff --exit-code -- lib
      - name: Verify package contents
        run: |
          npm pack --ignore-scripts
          node scripts/verify-package.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-sfd-package
          path: '*.tgz'
