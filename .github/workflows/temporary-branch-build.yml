name: Temporary branch distributable build

on:
  push:
    branches:
      - feat/native-workflow-parity-20261020

permissions:
  contents: write

jobs:
  build:
    if: github.repository == 'iBobbyTS/dsh-sfd'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Refresh checked-in distributable on this PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib
          if ! git diff --cached --quiet; then
            git commit -m "build: regenerate plugin distributable"
            git push origin HEAD:feat/native-workflow-parity-20261020
          fi
