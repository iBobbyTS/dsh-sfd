# One Host controller, with independent preset generations for bounded actors.
- insert:
    - id: dsh-sfd
      name: dsh-sfd
    - id: sfd-preset-planner
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: sfd-planner
        name: SFD Planner
        plugins:
          - name: '@deepseek-ai/dsh-agent-instructions'
            config: { maxBytes: 65536 }
          - name: '@deepseek-ai/dsh-tool-fs'
            config: { write: false, edit: false }
          - name: '@deepseek-ai/dsh-tool-fs-search'
            config: { sampleOverCapGlobResults: false }
          - name: dsh-sfd/role
            config: { kind: planner }
    - id: sfd-preset-plan-review-a
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: sfd-plan-review-a
        name: SFD Plan Review A
        plugins:
          - name: '@deepseek-ai/dsh-agent-instructions'
            config: { maxBytes: 65536 }
          - name: '@deepseek-ai/dsh-tool-fs'
            config: { write: false, edit: false }
          - name: '@deepseek-ai/dsh-tool-fs-search'
            config: { sampleOverCapGlobResults: false }
          - name: dsh-sfd/role
            config: { kind: plan-review-a }
    - id: sfd-preset-plan-review-b
      name: '@deepseek-ai/dsh-agent-preset'
